<div class="distr-card relative block p-6">
  @if (dismissible()) {
    <button
      type="button"
      (click)="dismissed.emit()"
      title="Hide instructions"
      class="absolute top-3 end-3 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
      <fa-icon [icon]="faXmark" />
      <span class="sr-only">Hide instructions</span>
    </button>
  }
  <div
    #content
    class="markdown text-gray-900 dark:text-white overflow-hidden"
    [class.pe-8]="dismissible()"
    [style.max-height]="expanded() ? null : '50vh'"
    [innerMarkdown]="description()"></div>
  @if (overflowing() || expanded()) {
    <div class="mt-3 flex justify-center">
      <button
        type="button"
        (click)="expanded.set(!expanded())"
        class="py-1.5 px-3 text-sm distr-btn-secondary hover:text-gray-900 dark:hover:text-white">
        <fa-icon [icon]="expanded() ? faChevronUp : faChevronDown" class="me-1" />
        @if (expanded()) {
          Show less
        } @else {
          Show more
        }
      </button>
    </div>
  }
</div>
