<section class="bg-gray-50 dark:bg-gray-900">
  <div class="mx-auto flex flex-col items-center justify-center px-6 py-8 md:h-screen lg:py-0">
    <app-portal-logo />
    <div
      class="w-full rounded-lg bg-white shadow-sm sm:max-w-md md:mt-0 xl:p-0 dark:border dark:border-gray-700 dark:bg-gray-800">
      <div class="space-y-4 p-6 sm:p-8 md:space-y-6">
        <h1
          class="text-center text-xl leading-tight font-bold tracking-tight text-gray-900 md:text-2xl dark:text-white">
          Thanks for signing up!
        </h1>
        <p class="text-center text-base font-normal text-gray-500 dark:text-gray-400">
          We've sent you an email. Please click the link inside of it to confirm your registration.
        </p>

        <div class="flex flex-col items-center">
          <button
            type="button"
            [disabled]="!requestMailEnabled"
            (click)="requestMail()"
            class="me-2 rounded-lg border border-gray-200 bg-white px-5 py-2.5 text-sm font-medium text-gray-900 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 focus:outline-none dark:border-gray-600 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-700">
            Send again
          </button>
          <p class="mt-5 text-center text-sm font-light text-gray-500 dark:text-gray-400">
            Already verified?<br />
            <button
              (click)="logoutAndRedirectToLogin()"
              class="font-medium text-primary-600 hover:underline dark:text-primary-500">
              Back to Login
            </button>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
