<section class="bg-gray-50 dark:bg-gray-900">
  <div class="mx-auto flex flex-col items-center justify-center px-6 py-8 md:h-screen lg:py-0">
    <app-portal-logo />
    <div
      class="w-full rounded-lg bg-white shadow-sm sm:max-w-md md:mt-0 xl:p-0 dark:border dark:border-gray-700 dark:bg-gray-800">
      <div class="space-y-4 p-6 sm:p-8 md:space-y-6">
        @if (success) {
          <h1
            class="text-center text-xl leading-tight font-bold tracking-tight text-gray-900 md:text-2xl dark:text-white">
            Check your inbox…
          </h1>
        } @else {
          <h1 class="text-xl leading-tight font-bold tracking-tight text-gray-900 md:text-2xl dark:text-white">
            Request password reset
          </h1>
          <form class="space-y-4 md:space-y-6" [formGroup]="formGroup" (ngSubmit)="submit()">
            <div>
              <label for="email" class="distr-label mb-2">Your email</label>
              <input
                type="email"
                formControlName="email"
                autotrim
                id="email"
                class="distr-input"
                appPlaceholder="email"
                required />
              @if (formGroup.controls.email.touched && formGroup.controls.email.errors) {
                <div class="text-sm text-red-500">Please enter a valid email address</div>
              }
            </div>
            @if (errorMessage) {
              <div class="text-sm text-red-500">{{ errorMessage }}</div>
            }
            <button
              type="submit"
              [disabled]="loading"
              class="w-full rounded-lg bg-primary-600 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-primary-700 focus:ring-4 focus:ring-primary-300 focus:outline-none dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
              Send E-Mail
            </button>
            <p class="text-center text-sm font-light text-gray-500 dark:text-gray-400">
              <a routerLink="/login" class="font-medium text-primary-600 hover:underline dark:text-primary-500"
                >Back to login</a
              >
            </p>
          </form>
        }
      </div>
    </div>
  </div>
</section>
