@let a = artifact();
<div
  class="sm:w-48 sm:self-start shrink-0 aspect-video rounded-lg overflow-hidden bg-gray-100 dark:bg-gray-700 border-gray-200 dark:border-gray-600 flex items-center justify-center"
  [class.border]="!titleImage()">
  @if (titleImage(); as image) {
    <img [attr.src]="image | secureImage | async" alt="" class="size-full object-cover" />
  } @else {
    <fa-icon [icon]="faBox" size="2x" class="text-gray-400 dark:text-gray-500" />
  }
</div>

<div class="flex-1 min-w-0">
  <a
    [routerLink]="['/artifacts', a.id]"
    class="font-semibold text-gray-900 dark:text-white group-hover:underline truncate block after:absolute after:inset-0">
    {{ a.name }}
  </a>

  <dl class="py-1 grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 text-sm">
    @if (a.lastPull; as pull) {
      <dt class="distr-text-muted">Version</dt>
      <dd class="text-gray-900 dark:text-white truncate">{{ pull.versionName }}</dd>

      <dt class="distr-text-muted">Last pull</dt>
      <dd class="text-gray-900 dark:text-white" [title]="pull.createdAt | date: 'medium'">
        {{ pull.createdAt | relativeDate }}
        @if (pulledBy(); as pulledBy) {
          by {{ pulledBy }}
        }
      </dd>
    } @else {
      <dt class="distr-text-muted">Last pull</dt>
      <dd class="distr-text-muted">Not pulled yet</dd>
    }
  </dl>
</div>
