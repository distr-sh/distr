@let a = artifact();
<app-customer-home-title-image [src]="a.titleImageUrl ?? a.imageUrl" [fallbackIcon]="faBox" />

<div class="flex-1 min-w-0">
  <a
    [routerLink]="['/artifacts', a.id]"
    class="font-semibold text-gray-900 dark:text-white truncate block after:absolute after:inset-0">
    {{ a.name }}
  </a>

  <dl class="py-1 grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 text-sm">
    @if (a.lastPull; as pull) {
      <dt class="distr-text-muted">Version</dt>
      <dd class="text-gray-900 dark:text-white truncate">{{ pull.versionName }}</dd>

      <dt class="distr-text-muted">Last pull</dt>
      <dd class="text-gray-900 dark:text-white" [title]="pull.createdAt | date: 'medium'">
        {{ pull.createdAt | relativeDate }}
        @if (pulledBy(); as pulledBy) {
          by {{ pulledBy }}
        }
      </dd>
    } @else {
      <dt class="distr-text-muted">Last pull</dt>
      <dd class="distr-text-muted">Not pulled yet</dd>
    }
  </dl>
</div>
