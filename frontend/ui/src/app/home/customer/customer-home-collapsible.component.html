<div
  #clip
  class="min-h-0 flex-1 overflow-hidden transition-[max-height] duration-300 ease-in-out"
  [class.max-h-96]="!expanded()"
  [class.lg:max-h-none]="fill() && !expanded()"
  [style.max-height.px]="maxHeight()"
  (transitionend)="onTransitionEnd($event)">
  <div #content>
    <ng-content />
  </div>
</div>
@if (overflowing() && !expanded()) {
  <div
    class="pointer-events-none absolute inset-x-0 bottom-0 flex h-24 items-end justify-center bg-linear-to-t from-white to-transparent dark:from-gray-800">
    <button
      type="button"
      (click)="expand()"
      class="distr-btn-secondary pointer-events-auto px-3 py-1.5 text-sm hover:text-gray-900 dark:hover:text-white">
      <fa-icon [icon]="faChevronDown" class="me-1" />
      Show more
    </button>
  </div>
}
@if (expanded() && !collapsing()) {
  <div class="mt-3 flex justify-center">
    <button
      type="button"
      (click)="collapse()"
      class="distr-btn-secondary px-3 py-1.5 text-sm hover:text-gray-900 dark:hover:text-white">
      <fa-icon [icon]="faChevronUp" class="me-1" />
      Show less
    </button>
  </div>
}
