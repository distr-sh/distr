@if (src(); as src) {
  <img [attr.src]="src | secureImage | async" alt="" class="size-full object-cover" />
} @else if (initials(); as initials) {
  <span class="text-3xl font-semibold tracking-wide text-gray-400 dark:text-gray-500 select-none" aria-hidden="true">
    {{ initials }}
  </span>
} @else if (icon(); as icon) {
  <fa-icon [icon]="icon" size="2x" class="text-gray-400 dark:text-gray-500" />
}
