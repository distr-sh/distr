<div class="distr-card relative block p-4">
  @if (dismissible()) {
    <button
      type="button"
      (click)="dismissed.emit()"
      title="Hide instructions"
      class="absolute top-3 inset-e-3 z-10 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
      <fa-icon [icon]="faXmark" />
      <span class="sr-only">Hide instructions</span>
    </button>
  }
  <app-customer-home-collapsible class="mx-auto max-w-5xl">
    <div
      class="markdown text-gray-900 dark:text-white"
      [class.pe-8]="dismissible()"
      [innerMarkdown]="description()"></div>
  </app-customer-home-collapsible>
</div>
