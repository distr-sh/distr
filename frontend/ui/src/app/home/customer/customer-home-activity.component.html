<div class="distr-card p-4">
  <h2 appCardHeading [icon]="faClockRotateLeft" class="mb-2">Activity</h2>
  <app-customer-home-collapsible class="-mx-2" [fill]="fillHeight()" [(expanded)]="expanded">
    <ul class="distr-home-list">
      @for (entry of entries(); track entry.id) {
        <li>
          <a [routerLink]="entry.link" [queryParams]="entry.queryParams" class="distr-home-row items-center">
            <fa-icon
              [icon]="entry.icon"
              class="distr-home-icon flex w-5 shrink-0 items-center justify-center text-lg" />
            <div class="min-w-0">
              <p class="distr-home-row-title first-letter:uppercase">{{ entry.action }}</p>
              <p class="distr-home-row-meta flex flex-wrap items-center gap-1.5">
                @if (entry.user; as user) {
                  <app-avatar
                    [image]="user.imageUrl"
                    [name]="user.name"
                    [imageIsLogo]="user.isVendor"
                    initialsClass="text-[0.5rem]"
                    class="distr-home-avatar" />
                  <span class="font-medium text-gray-700 dark:text-gray-300">{{ user.name }}</span>
                  <span aria-hidden="true">&middot;</span>
                }
                <time [attr.datetime]="entry.createdAt" [title]="entry.createdAt | date: 'medium'">
                  {{ entry.createdAt | relativeDate }}
                </time>
              </p>
            </div>
          </a>
        </li>
      }
    </ul>
  </app-customer-home-collapsible>
</div>
