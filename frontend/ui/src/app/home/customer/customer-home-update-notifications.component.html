<a routerLink="/notifications/updates" class="distr-card distr-card-hover block p-4">
  <h2 appCardHeading [icon]="faCircleArrowUp" class="mb-3">Update notifications</h2>
  <p class="distr-text-muted text-sm">You are not notified about new versions yet.</p>
  @if (canConfigure) {
    <span
      class="distr-btn-secondary mt-3 inline-flex items-center px-4 py-2 text-sm hover:text-gray-900 dark:hover:text-white"
      >Configure update notifications</span
    >
  }
</a>
