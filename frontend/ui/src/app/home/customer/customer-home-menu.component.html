<button
  type="button"
  title="More actions"
  class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  [attr.aria-expanded]="open()"
  (click)="open.set(true)">
  <fa-icon [icon]="faEllipsisVertical" />
  <span class="sr-only">More actions</span>
</button>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayHasBackdrop]="true"
  (backdropClick)="open.set(false)"
  (detach)="open.set(false)"
  [cdkConnectedOverlayBackdropClass]="'transparent'"
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayPositions]="[{originX: 'end', originY: 'bottom', overlayX: 'end', overlayY: 'top'}]"
  [cdkConnectedOverlayOpen]="open()">
  <ul
    role="none"
    animate.enter="animate-flip-in-top"
    animate.leave="animate-flip-out-top"
    class="distr-dropdown-panel my-2">
    @if (instructionsHidden()) {
      <li>
        <button type="button" (click)="open.set(false); showInstructions.emit()" class="distr-dropdown-item">
          <fa-icon [icon]="faEye" class="w-4 text-gray-500 dark:text-gray-400" />
          Show instructions
        </button>
      </li>
    }
    @if (checklistHidden()) {
      <li>
        <button type="button" (click)="open.set(false); showChecklist.emit()" class="distr-dropdown-item">
          <fa-icon [icon]="faListCheck" class="w-4 text-gray-500 dark:text-gray-400" />
          Show getting started
        </button>
      </li>
    }
  </ul>
</ng-template>
