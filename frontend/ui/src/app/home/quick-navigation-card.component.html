@if (lockedPlan(); as plan) {
  <div class="distr-card locked relative p-4">
    <ng-container [ngTemplateOutlet]="content" />
    <!-- Covers the card instead of wrapping it, because a button must not contain the heading. -->
    <button
      type="button"
      class="absolute inset-0 cursor-pointer rounded-lg focus-visible:-outline-offset-2"
      [title]="'Upgrade to ' + (plan | titlecase) + ' to enable ' + (heading() | lowercase)"
      cdkOverlayOrigin
      #origin="cdkOverlayOrigin"></button>
  </div>
  <app-plan-hint-overlay [origin]="origin" [plan]="plan" />
} @else if (link(); as link) {
  <a
    [routerLink]="link"
    [queryParams]="queryParams()"
    class="distr-card distr-card-clickable p-4"
    [class]="alertClass()">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <div class="distr-card p-4" [class]="alertClass()">
    <ng-container [ngTemplateOutlet]="content" />
  </div>
}

<ng-template #content>
  <div class="mb-3 flex items-center">
    <h2 appCardHeading [icon]="typeIcon() ? undefined : icon()">
      @if (typeIcon(); as typeIcon) {
        <fa-icon [icon]="typeIcon" class="me-2" />
      }
      {{ heading() }}
    </h2>
    @if (lockedPlan(); as plan) {
      <app-plan-badge [plan]="plan" class="ms-auto" />
    }
  </div>
  @if (count() !== undefined) {
    <span class="headline -mt-2 mb-1 flex items-baseline gap-1.5 font-bold text-gray-900 dark:text-white">
      <span class="text-3xl">{{ count() }}</span>
      <span class="text-lg">
        <ng-content />
      </span>
    </span>
  }
  <span class="subtitle distr-text-muted block text-xs">
    <ng-content select="[subtitle]" />
  </span>
</ng-template>
