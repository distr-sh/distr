<button
  id="theme-toggle"
  type="button"
  (click)="switchColorScheme()"
  class="inline-flex h-10 w-10 items-center justify-center rounded-lg p-2.5 text-sm text-gray-500 hover:bg-gray-100 focus:ring-4 focus:ring-gray-200 focus:outline-none dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-700">
  @if (colorSchemeSignal() === '') {
    <fa-icon
      id="theme-toggle-dark-icon"
      [icon]="faMoon"
      size="lg"
      class="mr-1 mb-1 h-4 w-4 text-gray-400 transition duration-75 dark:text-gray-400" />
  }
  @if (colorSchemeSignal() === 'dark') {
    <fa-icon
      id="theme-toggle-light-icon"
      [icon]="faSun"
      size="lg"
      class="mr-1 mb-1 h-4 w-4 text-gray-400 transition duration-75 dark:text-gray-400" />
  }
  <span class="sr-only">Toggle dark mode</span>
</button>
