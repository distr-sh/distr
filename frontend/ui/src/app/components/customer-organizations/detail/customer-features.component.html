<ul class="space-y-4">
  @for (row of rows(); track row.feature) {
    <li class="flex items-center gap-3" [class.ps-6]="row.requires">
      <label class="distr-toggle-label" [title]="row.unmetRequirement ?? ''">
        <input
          #featureToggle
          type="checkbox"
          class="peer sr-only"
          [checked]="row.enabled"
          [disabled]="!canEdit || !!row.lockedPlan || !!row.unmetRequirement"
          (click)="toggleFeature(row, featureToggle, $event)" />
        <div class="distr-toggle shrink-0"></div>
        {{ row.label }}
      </label>
      @if (row.lockedPlan; as plan) {
        <app-plan-badge [plan]="plan" />
      }
    </li>
  }
</ul>
