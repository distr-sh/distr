@if (isSupportDisabled() && customerOrganization(); as customer) {
  <app-customer-feature-disabled-alert
    [customerOrganization]="customer"
    feature="support_bundles"
    heading="Support is disabled for this customer."
    enableLabel="Enable support"
    enabledMessage="Support has been enabled for this customer"
    class="mb-4">
    The customer cannot create support requests until the feature is enabled.
  </app-customer-feature-disabled-alert>
}
<app-support-bundle-list
  #list
  [customerOrganizationId]="customerOrganizationId()"
  [class.hidden]="isSupportDisabled() && !list.hasBundles()" />
