@if (isDeploymentsDisabled() && customerOrganization(); as customer) {
  <app-customer-feature-disabled-alert
    [customerOrganization]="customer"
    feature="deployment_targets"
    heading="Deployments are disabled for this customer."
    enableLabel="Enable deployments"
    enabledMessage="Deployments have been enabled for this customer"
    class="mb-4">
    Until the feature is enabled, the customer portal shows no deployments and no new ones can be created.
  </app-customer-feature-disabled-alert>
}
<app-deployment-targets
  [customerOrganizationId]="customerOrganizationId()"
  [customerFeatureDisabled]="isDeploymentsDisabled()" />
