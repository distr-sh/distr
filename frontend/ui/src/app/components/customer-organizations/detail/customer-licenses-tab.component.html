@if (canCopyFromAnotherCustomer()) {
  <app-alert type="info" heading="This customer has no licenses yet.">
    Start with a copy of another customer's license keys and entitlements and adjust them afterwards.
    <button alertActions type="button" (click)="openCopyModal()" class="distr-btn-primary shrink-0 px-3 py-1.5">
      <fa-icon [icon]="faCopy" class="mr-2" />
      Copy from another customer
    </button>
  </app-alert>
}
<div class="distr-toolbar">
  <app-search-bar [control]="searchControl" placeholder="Filter licenses" />
</div>
<app-license-keys [customerOrganizationId]="customerOrganizationId()" [search]="search()">
  <h2 heading appCardHeading>License Keys</h2>
</app-license-keys>
<app-application-entitlements [customerOrganizationId]="customerOrganizationId()" [search]="search()">
  <h2 heading appCardHeading>Application Entitlements</h2>
</app-application-entitlements>
<app-artifact-entitlements [customerOrganizationId]="customerOrganizationId()" [search]="search()">
  <h2 heading appCardHeading>Artifact Entitlements</h2>
</app-artifact-entitlements>
