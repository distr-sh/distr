@if (!isClosing()) {
  <div
    class="relative max-h-full w-full max-w-2xl p-4 lg:mt-32"
    animate.enter="animate-fly-in-top"
    animate.leave="animate-fly-out-top"
    (animationend)="animationComplete()">
    <!-- Modal content -->
    <div class="relative rounded-lg bg-white shadow dark:bg-gray-700">
      <form [formGroup]="form" (ngSubmit)="save()">
        <!-- Modal header -->
        <div class="flex items-center justify-between rounded-t border-b p-4 md:p-5 dark:border-gray-600">
          <h3 class="text-xl font-semibold text-gray-900 dark:text-white">Upload Image</h3>
          <button
            type="button"
            class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
            (click)="dialogRef.dismiss()">
            <fa-icon [icon]="faXmark" />
            <span class="sr-only">Close modal</span>
          </button>
        </div>
        <!-- Modal body -->
        <div class="space-y-4 p-4 md:p-5">
          <div class="grid gap-4">
            <div class="space-y-4">
              <div>
                <div>
                  @if (imageSrc | async; as image) {
                    <img class="mb-4 h-48" [src]="image" alt="Image" />
                    <button
                      type="button"
                      (click)="deleteImage()"
                      class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-900 hover:bg-gray-100 hover:text-primary-700 focus:z-10 focus:ring-4 focus:ring-gray-200 focus:outline-none dark:border-gray-600 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-700">
                      Delete
                    </button>
                  } @else {
                    <label class="distr-label mb-2" for="file_input"> Image </label>
                    <input
                      [accept]="accept"
                      (change)="onImageChange($event)"
                      class="w-full cursor-pointer rounded-lg border border-gray-300 bg-gray-50 text-sm text-gray-900 focus:outline-none dark:border-gray-600 dark:bg-gray-700 dark:text-gray-400"
                      aria-describedby="file_input_help"
                      id="file_input"
                      type="file" />
                  }
                </div>

                <p class="mt-1 mb-3 text-xs font-normal text-gray-500 dark:text-gray-400" id="file_input_help">
                  {{ acceptDescription }}
                </p>
                <div class="flex items-center space-x-2.5"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- Modal footer -->
        <div
          class="flex items-center justify-end gap-2 rounded-b border-t border-gray-200 p-4 md:p-5 dark:border-gray-600">
          <button
            (click)="dialogRef.dismiss()"
            type="button"
            class="rounded-lg border border-gray-200 bg-white px-5 py-2.5 text-sm font-medium text-gray-900 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 focus:outline-none dark:border-gray-600 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-700">
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="form.invalid || formLoading()"
            class="distr-btn-primary text-white disabled:cursor-not-allowed disabled:opacity-60">
            Upload
          </button>
        </div>
      </form>
    </div>
  </div>
}
