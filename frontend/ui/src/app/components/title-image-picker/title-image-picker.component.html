<button
  type="button"
  class="w-32 aspect-video shrink-0 rounded-md overflow-hidden border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 flex items-center justify-center text-gray-400 enabled:cursor-pointer enabled:hover:border-primary-500"
  aria-label="Title image"
  [disabled]="!editable()"
  (click)="pick()">
  @if (imageUrl(); as url) {
    <img class="size-full object-cover" [attr.src]="url | secureImage | async" alt="Title image" />
  } @else {
    <fa-icon [icon]="faImage" size="lg" />
  }
</button>
<div class="text-xs text-gray-500 dark:text-gray-400 max-w-56">
  <div class="font-medium text-gray-900 dark:text-white">Title image</div>
  This title image is displayed on the customer home page. Recommended 960 x 540 px, max 500 KiB.
</div>
