<div class="mb-6 flex h-16 items-center text-4xl font-semibold text-gray-900 dark:text-white">
  @if (showCustomLogo()) {
    <img class="h-full border-none" [src]="logoUrl()" alt="Logo" />
  } @else {
    <img class="mr-4 h-full border-none" src="distr-logo.svg" alt="Distr Logo" />
    @if (showWebsiteLink()) {
      <a [href]="websiteUrl" target="_blank" rel="noopener">Distr</a>
    } @else {
      <span>Distr</span>
    }
  }
</div>
