@if (firstCustomerOrganization(); as firstCustomer) {
  <nav class="m-4 flex items-center justify-between">
    <div class="inline-flex items-center text-sm font-medium text-gray-700 dark:text-gray-400">
      <fa-icon class="mr-2" [icon]="icon()" />
      {{ label() }}
    </div>
    <a
      [routerLink]="['/', 'customers', firstCustomer.id, section()]"
      class="distr-link inline-flex items-center py-2 text-sm whitespace-nowrap">
      {{ linkLabel() }}
      <fa-icon [icon]="faArrowRight" class="ml-2" />
    </a>
  </nav>
}
