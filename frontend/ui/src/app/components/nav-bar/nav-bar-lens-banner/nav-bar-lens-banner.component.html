<div
  class="flex h-17 w-full items-center justify-between gap-4 border-b border-amber-200 bg-amber-50 px-4 md:gap-8 dark:border-amber-800 dark:bg-gray-900">
  <div class="flex items-center">
    <fa-icon size="lg" [icon]="faShuffle" class="mr-3 hidden h-6 w-6 text-amber-600 lg:flex dark:text-amber-400" />
    <p class="text-sm text-gray-700 dark:text-gray-300">
      @if (isSuperAdmin) {
        You are viewing the customer portal of
        <span class="font-semibold text-gray-900 dark:text-white">{{ lensName() }}</span> with read-only access.
      } @else {
        <span class="font-semibold text-amber-700 dark:text-amber-400">Customer Lens:</span>
        You are working in the customer portal of
        <span class="font-semibold text-gray-900 dark:text-white">{{ lensName() }}</span
        ><span class="hidden md:inline">
          with your
          <span class="font-semibold text-gray-900 dark:text-white">{{ organization().userRole | userRoleLabel }}</span>
          role. Changes you make here apply to {{ lensName() }}</span
        >.
      }
    </p>
  </div>
  <button type="button" (click)="leaveLens.emit()" class="distr-btn-secondary shrink-0 px-3 py-2 text-sm font-medium">
    @switch (ownKind()) {
      @case ('partner') {
        Return to Partner Portal
      }
      @default {
        Return to Vendor Portal
      }
    }
  </button>
</div>
