<div class="space-y-4">
  <div class="space-y-2">
    <h2 class="text-xl font-bold dark:text-white">Secrets</h2>
    <p class="text-sm font-normal text-gray-500 dark:text-gray-400">
      Store credentials for your internal deployments. Secrets of a customer are managed on that customer's page.
    </p>
  </div>

  <app-secrets
    class="-mx-6 -mb-6 block overflow-hidden rounded-b-lg"
    [secrets]="secrets()"
    (refresh)="refresh$.next()" />
</div>
