<section class="bg-gray-50 dark:bg-gray-900 p-3 sm:p-5 antialiased">
  <div class="mx-auto max-w-screen-lg px-4">
    <div class="bg-white dark:bg-gray-800 relative shadow-md rounded-lg overflow-hidden p-10 mb-20">
      <h1 class="mb-6 text-3xl font-extrabold leading-none tracking-tight text-gray-900 md:text-4xl dark:text-white">
        Organization Settings
      </h1>

      <app-tab-bar [tabs]="tabs()" [(active)]="activeTab" (tabClick)="onTabClick($event)">
        <ng-template #tabSuffix let-tab let-origin="origin">
          @if (tab.disabled) {
            <app-plan-badge plan="business" class="ml-2" />
            <ng-template
              cdkConnectedOverlay
              [cdkConnectedOverlayOrigin]="origin"
              [cdkConnectedOverlayOpen]="planHintOpen()"
              [cdkConnectedOverlayHasBackdrop]="true"
              [cdkConnectedOverlayBackdropClass]="'transparent'"
              (backdropClick)="planHintOpen.set(false)"
              [cdkConnectedOverlayPositions]="[
                {originX: 'center', overlayX: 'center', originY: 'bottom', overlayY: 'top'},
              ]">
              <app-plan-feature-hint plan="business" />
            </ng-template>
          }
        </ng-template>
      </app-tab-bar>

      <!-- The panels stay mounted and are only hidden, so that switching tabs does not discard
        what has been typed into the other tab's form. -->
      <div
        role="tabpanel"
        id="tabpanel-general"
        aria-labelledby="tab-general"
        class="pt-6"
        [hidden]="activeTab() !== 'general'">
        <app-general-settings />
      </div>

      @if (customEmailVisible()) {
        <div
          role="tabpanel"
          id="tabpanel-email"
          aria-labelledby="tab-email"
          class="pt-6"
          [hidden]="activeTab() !== 'email'">
          <app-custom-email />
        </div>
      }
    </div>
  </div>
</section>
