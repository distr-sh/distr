<section class="bg-gray-50 dark:bg-gray-900 p-3 sm:p-5 antialiased">
  <div class="mx-auto max-w-screen-lg px-4">
    <div class="bg-white dark:bg-gray-800 relative shadow-md sm:rounded-lg overflow-hidden p-10">
      <h1 class="mb-2 text-3xl font-extrabold leading-none tracking-tight text-gray-900 md:text-4xl dark:text-white">
        Branding
      </h1>
      <p class="text-gray-500 dark:text-gray-400 mb-6">
        Customize how Distr looks for your team and your customers. Upload a logo, set a customer portal name and a
        welcome page. Custom domains are configured by Distr support.
      </p>

      <form (submit)="$event.preventDefault(); save()">
        <app-branding-form class="block" />

        @if (!auth.isSuperAdmin()) {
          <button
            type="submit"
            [disabled]="formLoading()"
            class="w-full mt-8 flex items-center justify-center distr-btn-primary text-white disabled:opacity-60 disabled:cursor-not-allowed">
            <fa-icon [icon]="faFloppyDisk" size="lg" class="h-4 w-4 mr-2 -ml-0.5 mb-1" />
            Save
          </button>
        }
      </form>
    </div>
  </div>
</section>
