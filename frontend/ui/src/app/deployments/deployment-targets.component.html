<div class="distr-toolbar mb-4">
  <div class="flex grow flex-col items-stretch gap-3 md:flex-row md:items-center">
    <app-search-bar [control]="filterForm.controls.search" placeholder="Filter deployments" />

    @if (canFilterByCustomer()) {
      <app-multi-select
        class="shrink-0 md:w-40"
        idPrefix="customer-filter"
        placeholder="All customers"
        itemLabel="customers"
        searchPlaceholder="Search customers"
        [searchable]="true"
        [options]="customerSelectOptions()"
        [selected]="selectedCustomerIds()"
        (selectedChange)="selectCustomers($event)" />
    }

    <app-multi-select
      class="shrink-0 md:w-40"
      idPrefix="application-filter"
      placeholder="All applications"
      itemLabel="applications"
      [options]="applicationSelectOptions()"
      [selected]="selectedApplicationIds()"
      (selectedChange)="selectApplications($event)" />

    <app-multi-select
      class="shrink-0 md:w-40"
      idPrefix="status-filter"
      placeholder="All statuses"
      itemLabel="statuses"
      [options]="statusSelectOptions"
      [selected]="selectedStatuses()"
      (selectedChange)="selectStatuses($event)" />
  </div>

  <div class="distr-toolbar-actions">
    @if (auth.hasAnyRole('read_write', 'admin')) {
      <button
        (click)="openWizard()"
        [disabled]="(auth.isCustomer() || customerOrganizationId()) && limitReached()"
        [title]="limitReached() ? 'Limit reached' : ''"
        type="button"
        id="createDeploymentTargetButton2"
        class="flex w-full items-center justify-center rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-900 hover:bg-gray-100 hover:text-primary-700 focus:z-10 focus:ring-4 focus:ring-gray-200 focus:outline-none disabled:cursor-not-allowed disabled:opacity-50 md:w-auto dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-700">
        <fa-icon [icon]="plusIcon" class="mr-2 text-gray-500 dark:text-gray-400" />
        New Deployment
      </button>
    }
  </div>
</div>

<div class="distr-card-grid-wide">
  @for (deploymentTarget of filteredDeploymentTargets$ | async; track deploymentTarget.id) {
    <app-deployment-target-card
      [deploymentTarget]="deploymentTarget"
      [deploymentTargetMetrics]="deploymentTarget.metrics" />
  } @empty {
    <div class="col-span-full text-gray-500 dark:text-gray-400">No deployments found.</div>
  }
</div>

<ng-template #deploymentModal>
  <app-deployment-modal
    animate.enter="animate-fly-in-top"
    animate.leave="animate-fly-out-top"
    [deploymentTarget]="selectedDeploymentTarget()!"
    [deployment]="selectedDeployment()"
    [versionId]="selectedApplicationVersionId()"
    (closed)="hideModal()" />
</ng-template>

<ng-template #deploymentWizard>
  <app-deployment-wizard [customerOrganizationId]="customerOrganizationId()" (closed)="hideModal()" />
</ng-template>
