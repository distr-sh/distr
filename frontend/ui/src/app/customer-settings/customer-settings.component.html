<app-page variant="narrow">
  <div class="distr-panel">
    @if (vendorScoped() && customerOrganization(); as customer) {
      <nav class="mb-6 flex justify-between" aria-label="Breadcrumb">
        <ol class="mb-3 inline-flex items-center sm:mb-0">
          <li class="flex items-center">
            <a
              [routerLink]="['/', 'customers']"
              class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600 dark:text-gray-400 dark:hover:text-white">
              <fa-icon class="mr-2" [icon]="faBoxesStacked" />
              Customers
            </a>
          </li>
          <span class="mx-2 text-gray-400">/</span>
          <li aria-current="page">
            <div class="flex items-center">
              <button
                id="application-dropdown"
                cdkOverlayOrigin
                #dropdownTrigger="cdkOverlayOrigin"
                #dropdownTriggerButton
                (click)="toggleBreadcrumbDropdown()"
                class="inline-flex items-center rounded-lg px-3 py-2 text-center text-sm font-normal text-gray-700 hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 focus:outline-none dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white dark:focus:ring-gray-700">
                {{ customer.name }}
                <fa-icon class="ml-2" [icon]="faChevronDown" />
              </button>
              <ng-template
                cdkConnectedOverlay
                [cdkConnectedOverlayHasBackdrop]="true"
                (backdropClick)="breadcrumbDropdown.set(false)"
                [cdkConnectedOverlayBackdropClass]="'transparent'"
                [cdkConnectedOverlayOrigin]="dropdownTrigger"
                [cdkConnectedOverlayMinWidth]="breadcrumbDropdownWidth + 'px'"
                [cdkConnectedOverlayOpen]="breadcrumbDropdown()">
                <div
                  animate.enter="animate-flip-in-top"
                  animate.leave="animate-flip-out-top"
                  class="distr-dropdown-panel w-full">
                  <ul aria-labelledby="dropdownDefault">
                    @for (customer of customerOrganizations(); track customer.id) {
                      <li>
                        <a class="distr-dropdown-item" [routerLink]="['/', 'customers', customer.id, 'settings']">{{
                          customer.name
                        }}</a>
                      </li>
                    }
                  </ul>
                </div>
              </ng-template>
            </div>
          </li>
        </ol>
      </nav>
    }

    @if (customerOrganizationId(); as customerOrganizationId) {
      <app-custom-oidc [customerOrganizationId]="customerOrganizationId" />
    }
  </div>
</app-page>
