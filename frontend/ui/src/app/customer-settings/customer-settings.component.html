<app-page variant="narrow">
  <div class="distr-panel">
    @if (customerOrganization(); as customerOrganization) {
      <div class="flex flex-col gap-10">
        <section class="space-y-4">
          <h2 class="text-xl font-bold dark:text-white">Controllers</h2>
          <app-customer-controller-settings [customerOrganizationId]="customerOrganization.id" />
        </section>
        @if (oidcProvidersEnabled()) {
          <section class="space-y-4">
            <h2 class="text-xl font-bold dark:text-white">Custom Domains &amp; Identity Provider</h2>
            <app-customer-domain-and-sign-in [customerOrganizationId]="customerOrganization.id" />
          </section>
        }
      </div>
    }
  </div>
</app-page>
