<section class="bg-gray-50 dark:bg-gray-900">
  <div class="mx-auto flex flex-col items-center justify-center px-6 py-8 md:h-screen lg:py-0">
    <app-portal-logo [linkToWebsite]="true" />
    <div
      class="w-full rounded-lg bg-white shadow-sm sm:max-w-md md:mt-0 xl:p-0 dark:border dark:border-gray-700 dark:bg-gray-800">
      <div class="space-y-4 p-6 text-center sm:p-8 md:space-y-6">
        <fa-icon [icon]="faScrewdriverWrench" class="block text-6xl text-gray-900 dark:text-white" />
        <h1 class="text-xl leading-tight font-bold tracking-tight text-gray-900 md:text-2xl dark:text-white">
          We'll be right back
        </h1>
        <p class="text-sm font-light text-gray-500 dark:text-gray-400">
          Distr is temporarily unavailable while we perform maintenance. This page will reconnect automatically as soon
          as the service is back.
        </p>
        <p class="text-sm font-light text-gray-500 dark:text-gray-400">
          For live updates, check our
          <a
            href="https://distrstatus.com/"
            target="_blank"
            rel="noopener"
            class="font-medium text-primary-600 hover:underline dark:text-primary-500"
            >status page</a
          >.
        </p>
        <button
          type="button"
          (click)="check()"
          [disabled]="checking()"
          class="w-full rounded-lg bg-primary-600 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-primary-700 focus:ring-4 focus:ring-primary-300 focus:outline-none disabled:opacity-50 dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
          {{ checking() ? 'Checking…' : 'Reload' }}
        </button>
      </div>
    </div>
  </div>
</section>
