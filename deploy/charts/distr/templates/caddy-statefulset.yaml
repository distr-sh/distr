{{- if .Values.caddy.enabled }}
{{- /* A StatefulSet, because every replica keeps its own certificate storage: Caddy instances
form a cluster only when they share storage, which would require a ReadWriteMany volume or a
storage module compiled into a custom image. Independent per-replica storage is preferred here,
at the cost of one ACME issuance per replica and domain. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "distr.fullname" . }}-caddy
  labels:
    {{- include "distr.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  replicas: {{ .Values.caddy.replicaCount }}
  serviceName: {{ include "distr.fullname" . }}-caddy-headless
  # Certificates are per-replica anyway, so there is no reason to start or update the pods
  # one after another.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "distr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: caddy
  template:
    metadata:
      annotations:
        checksum/caddyfile: {{ include (print $.Template.BasePath "/caddy-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "distr.labels" . | nindent 8 }}
        app.kubernetes.io/component: caddy
    spec:
      containers:
        - name: caddy
          image: "{{ .Values.caddy.image.repository }}:{{ .Values.caddy.image.tag }}"
          imagePullPolicy: {{ .Values.caddy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
          livenessProbe:
            tcpSocket:
              port: https
          {{- with .Values.caddy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "distr.fullname" . }}-caddy
        - name: config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "distr.labels" . | nindent 10 }}
          app.kubernetes.io/component: caddy
      spec:
        accessModes:
          {{- toYaml .Values.caddy.persistence.accessModes | nindent 10 }}
        {{- with .Values.caddy.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.caddy.persistence.size | quote }}
{{- end }}
