{{- if .Values.caddy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distr.fullname" . }}-caddy
  labels:
    {{- include "distr.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
  {{- with .Values.caddy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.caddy.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "distr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
---
{{- /* Governing Service of the Caddy StatefulSet. It only provides stable pod DNS names and is
never used to reach Caddy: public traffic goes through the LoadBalancer Service above. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distr.fullname" . }}-caddy-headless
  labels:
    {{- include "distr.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "distr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
{{- end }}
