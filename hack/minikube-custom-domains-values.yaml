# Helm values for testing self-service custom domains on a local minikube cluster.
#
#   mise run docker-build:hub
#   minikube image load ghcr.io/distr-sh/distr:snapshot
#   helm dependency build deploy/charts/distr
#   helm upgrade --install distr deploy/charts/distr -n distr --create-namespace \
#     -f hack/minikube-custom-domains-values.yaml
#
# The distr-caddy Service stays pending without "minikube tunnel" (needs root), so reach it
# through its node ports instead, e.g. for a domain registered as "app.test.local":
#
#   PORT=$(kubectl -n distr get svc distr-caddy -o jsonpath='{.spec.ports[?(@.name=="https")].nodePort}')
#   curl -k --resolve app.test.local:$PORT:$(minikube ip) https://app.test.local:$PORT/
#
# Certificates are issued by Caddy's internal CA (caddy.issuer=internal) because a local
# cluster has no publicly resolvable domain to pass an ACME challenge for. Everything else
# (the ask endpoint, on-demand issuance, path routing) behaves exactly like in production,
# so use curl -k / --cacert with the Caddy root from /data/caddy/pki.

replicaCount: 1

image:
  # Enterprise edition build: the community edition would force every organization to the
  # community subscription type and strip the custom_domains feature on startup.
  repository: ghcr.io/distr-sh/distr
  tag: snapshot
  pullPolicy: IfNotPresent

hub:
  env:
    - name: DISTR_HOST
      value: http://distr.local
    - name: JWT_SECRET
      value: 'WQrGMYx4tZdGwKlt0RTrhMzfQ+j1wr6z7oRWfmGlETk='
    - name: USER_EMAIL_VERIFICATION_REQUIRED
      value: 'false'
    - name: REGISTRY_ENABLED
      value: 'true'
    - name: REGISTRY_HOST
      value: pkg.distr.local
    - name: REGISTRY_S3_BUCKET
      value: distr
    - name: REGISTRY_S3_CREATE_BUCKET
      value: 'true'
    - name: REGISTRY_S3_REGION
      value: local
    - name: REGISTRY_S3_ENDPOINT
      value: http://distr-rustfs-svc:9000
    - name: REGISTRY_S3_ACCESS_KEY_ID
      value: distr
    - name: REGISTRY_S3_SECRET_ACCESS_KEY
      value: distr123
    - name: REGISTRY_S3_USE_PATH_STYLE
      value: 'true'
    - name: REGISTRY_S3_ALLOW_REDIRECT
      value: 'false'
    - name: LOKI_URL
      value: http://distr-loki:3100

caddy:
  enabled: true
  appCnameTarget: custom-app.distr.local
  registryCnameTarget: custom-registry.distr.local
  issuer: internal
  acmeEmail: dev@distr.local

postgresql:
  enabled: true
  auth:
    password: distr123

rustfs:
  enabled: true
