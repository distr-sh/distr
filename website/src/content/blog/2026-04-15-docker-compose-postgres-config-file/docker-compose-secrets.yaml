services:
  postgres:
    image: 'postgres:18.6-alpine3.24'
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: app
    configs:
      - source: postgresql.conf
        target: /etc/postgresql/postgresql.conf
    secrets:
      - postgres_password

configs:
  postgresql.conf:
    file: ./postgresql.conf

secrets:
  postgres_password:
    file: ./postgres_password.txt
