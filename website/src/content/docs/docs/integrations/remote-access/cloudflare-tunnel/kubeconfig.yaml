apiVersion: v1
kind: Config
clusters:
  - name: acme
    cluster:
      server: https://127.0.0.1:6443
      tls-server-name: kubernetes.default.svc
      certificate-authority-data: CLUSTER-CA-BASE64
users:
  - name: acme-vendor-support
    user:
      token: SERVICE-ACCOUNT-TOKEN
contexts:
  - name: acme
    context:
      cluster: acme
      user: acme-vendor-support
      namespace: acme
current-context: acme
