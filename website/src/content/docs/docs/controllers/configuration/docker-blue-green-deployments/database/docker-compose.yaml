services:
  postgres:
    image: 'postgres:18.6-alpine3.24'
    restart: unless-stopped
    environment:
      POSTGRES_USER: hello-distr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hello-distr
    volumes:
      - 'postgres:/var/lib/postgresql/'
    networks:
      - hello-distr
    healthcheck:
      test: pg_isready -h localhost -U hello-distr -d hello-distr
      start_interval: 1s
      interval: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres:

networks:
  hello-distr:
    external: true
