services:
  postgres:
    image: 'postgres:18.6-alpine3.24'
    restart: unless-stopped
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: acme
    volumes:
      - 'postgres:/var/lib/postgresql/'
    networks:
      acme-shared:
        aliases:
          - acme-db
    healthcheck:
      test: pg_isready -h localhost -U acme -d acme
      start_interval: 1s
      interval: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres:

networks:
  acme-shared:
    external: true
