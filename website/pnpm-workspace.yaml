auditConfig:
  ignoreGhsas:
    # braces has no fix; starlight-llms-txt only matches our own config globs at build time
    - GHSA-vfj7-8cjw-p6xm
    # postcss-selector-parser 6.x via Expressive Code only parses our own CSS at build time
    - GHSA-rj75-hqrm-r3gf
allowBuilds:
  esbuild: false
  sharp: false
minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.1 || 0.3.8'
  - '@astrojs/mdx@7.0.0 || 7.0.8'
  - '@astrojs/preact@6.0.0'
  - astro@7.0.0 || 7.2.6
  - '@astrojs/starlight@0.41.8'
onlyBuiltDependencies:
  - esbuild
  - sharp
