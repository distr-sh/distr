# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build Controllers

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'website/**'
      - 'docker-autoheal/**'
      - 'sdk/**'
      - 'deploy/charts/**'
      - 'frontend/**'
  pull_request:
    paths-ignore:
      - 'website/**'
      - 'docker-autoheal/**'
      - 'sdk/**'
      - 'deploy/charts/**'
      - 'frontend/**'
  workflow_call:

# github.workflow is the caller's name in a called workflow, so it cannot tell the builds of a release apart.
concurrency:
  group: build-controllers-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'

jobs:
  build-controller:
    # The release pull request only bumps versions of what main has already checked.
    if: ${{ github.head_ref != 'release-please--branches--main' }}
    timeout-minutes: 30
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        controller:
          - docker-controller
          - kubernetes-controller
        platform:
          - arch: linux/amd64
            goarch: amd64
            runner: ubuntu-latest
          - arch: linux/arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY_IMAGE: ghcr.io/distr-sh/distr/${{ matrix.controller }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: ${{ matrix.controller }}
      - name: Generate commit hash
        id: generate
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build controller
        run: go build -ldflags="$LDFLAGS" -o "dist/$CONTROLLER-$GOARCH" "./cmd/controller/${CONTROLLER%-controller}/"
        env:
          CONTROLLER: ${{ matrix.controller }}
          GOARCH: ${{ matrix.platform.goarch }}
          LDFLAGS: >-
            -s -w
            -X github.com/distr-sh/distr/internal/buildconfig.version=${{ github.ref_name }}
            -X github.com/distr-sh/distr/internal/buildconfig.commit=${{ steps.generate.outputs.sha_short }}
      - name: Save Go cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/save-go-cache
      - name: Get current date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.licenses=Apache-2.0
      - name: Docker build (push only for tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform.arch }}
          context: .
          file: Dockerfile.${{ matrix.controller }}
          build-args: |
            APK_UPGRADE_DATE=${{ steps.date.outputs.date }}
          tags: ${{ env.REGISTRY_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/') }}
          sbom: true
          provenance: mode=max
      - name: Prepare for export
        run: |
          platform=${{ matrix.platform.arch }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.controller }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build-controller
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        controller:
          - docker-controller
          - kubernetes-controller
    env:
      REGISTRY_IMAGE: ghcr.io/distr-sh/distr/${{ matrix.controller }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.controller }}-*
          merge-multiple: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Distr Registry (non-rc tag only)
        if: ${{ !contains(github.ref_name, '-rc.') }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: registry.distr.sh
          username: ${{ github.actor }}
          password: ${{ secrets.DISTR_CONTROLLER_REPOSITORY_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
            ${{ !contains(github.ref_name, '-rc.') && format('registry.distr.sh/distr/{0}', matrix.controller) || '' }}
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.description=Distr controller software
            org.opencontainers.image.vendor=Glasskube
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation index:org.opencontainers.image.licenses=Apache-2.0 \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Get digest of the created image
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }} --format "{{ print .Manifest.Digest }}")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign the images with GitHub OIDC Token
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
