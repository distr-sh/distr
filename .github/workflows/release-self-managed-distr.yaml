# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Self-Managed Distr

on:
  push:
    tags:
      - '*'
      - '!*-rc.*'

jobs:
  wait-for-images:
    name: Wait for images
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # The versions reference the distr-ee image and hand out the controller images,
      # so both builds of this tag have to have pushed to registry.distr.sh first.
      - name: Wait for Build Distr and Build Controllers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in build-distr.yaml build-controller.yaml; do
            run_id=""
            for _ in $(seq 30); do
              run_id="$(gh run list --workflow "$workflow" --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[].databaseId')"
              [ -n "$run_id" ] && break
              sleep 10
            done
            if [ -z "$run_id" ]; then
              echo "No run of $workflow found for $GITHUB_REF_NAME"
              exit 1
            fi
            gh run watch "$run_id" --exit-status --compact --interval 30
          done

  create-version:
    name: Create version (${{ matrix.application.name }})
    needs: wait-for-images
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        application:
          - name: enterprise
            id: ${{ vars.DISTR_ENTERPRISE_APPLICATION_ID }}
          - name: enterprise-aws
            id: ${{ vars.DISTR_ENTERPRISE_AWS_APPLICATION_ID }}
          - name: enterprise-gcp
            id: ${{ vars.DISTR_ENTERPRISE_GCP_APPLICATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Distr version
        uses: distr-sh/distr-create-version-action@13a9244a46f3d9019f1e2a6c0063f88908fafff3 # v1.6.2
        with:
          api-token: ${{ secrets.DISTR_TOKEN }}
          application-id: ${{ matrix.application.id }}
          version-name: ${{ github.ref_name }}
          compose-file: ${{ github.workspace }}/deploy/docker/${{ matrix.application.name }}/docker-compose.yaml
          template-file: ${{ github.workspace }}/deploy/docker/${{ matrix.application.name }}/.env
          link-template: '{{ .Env.DISTR_HOST }}'
