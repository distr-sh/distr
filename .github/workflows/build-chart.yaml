name: Build helm chart

on:
  push:
    branches:
      - 'main'
    paths:
      - 'deploy/charts/**'
      - '.github/workflows/build-chart.yaml'
    tags:
      - '*'
  pull_request:
    paths:
      - deploy/charts/**
      - .github/workflows/build-chart.yaml
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the helm chart to ghcr.io'
        type: boolean
        default: false

jobs:
  build-chart:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy/charts
      - name: Setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Build helm chart
        run: |
          helm repo add rustfs https://charts.rustfs.com/
          helm dependency build deploy/charts/distr
          helm lint --strict deploy/charts/distr
          helm package deploy/charts/distr
      - name: Login to GitHub Container Registry (tag or manual only)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Distr Registry (tag or manual only)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.distr.sh
          username: ${{ github.actor }}
          password: ${{ secrets.DISTR_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
      - name: Push and sign helm chart (tag or manual only)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        env:
          CERTIFICATE_IDENTITY: ^https://github\.com/distr-sh/distr/\.github/workflows/build-chart\.yaml@
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          # a failing helm push must fail the step even though its output is piped into tee
          set -o pipefail
          for chart in distr-*.tgz; do
              helm push "$chart" oci://ghcr.io/distr-sh/charts 2>&1 | tee push.log
              digest="$(awk '/^Digest: /{print $2}' push.log)"
              # Artifact Hub looks a chart's cosign signature up under the legacy sha256-<digest>.sig tag, and
              # ghcr.io implements no referrers API that cosign could use instead, so the new bundle format
              # would end up on a fallback tag Artifact Hub does not read. cosign refuses the legacy format
              # together with the TUF signing config, which is why that has to be turned off as well.
              cosign sign --yes --new-bundle-format=false --use-signing-config=false \
                "ghcr.io/distr-sh/charts/distr@${digest}"
              cosign verify \
                --certificate-identity-regexp "$CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
                "ghcr.io/distr-sh/charts/distr@${digest}" > /dev/null

              helm push "$chart" oci://registry.distr.sh/enterprise/charts 2>&1 | tee push.log
              digest="$(awk '/^Digest: /{print $2}' push.log)"
              cosign sign --yes "registry.distr.sh/enterprise/charts/distr@${digest}"
              cosign verify \
                --certificate-identity-regexp "$CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
                "registry.distr.sh/enterprise/charts/distr@${digest}" > /dev/null
          done
