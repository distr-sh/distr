name: Build helm chart

on:
  push:
    branches:
      - 'main'
    paths:
      - 'deploy/charts/**'
      - '.github/workflows/build-chart.yaml'
    tags:
      - '*'
  pull_request:
    paths:
      - deploy/charts/**
      - .github/workflows/build-chart.yaml
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the helm chart to ghcr.io'
        type: boolean
        default: false

jobs:
  build-chart:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hack/ holds the script the mise environment sources. Cone mode always checks out the
          # repository root, so mise.toml needs no entry.
          sparse-checkout: |
            deploy/charts
            hack
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: 'helm github:losisin/helm-values-schema-json'
      - name: Check that the values schema is up to date
        run: |
          mise run build:helm-schema
          git diff --exit-code deploy/charts/distr/values.schema.json
      - name: Build helm chart
        run: |
          helm repo add rustfs https://charts.rustfs.com/
          helm dependency build deploy/charts/distr
          helm lint --strict deploy/charts/distr
          helm package deploy/charts/distr
      - name: Render the example values against the schema
        run: |
          for values in deploy/charts/distr/examples/*/*.yaml; do
            helm template distr deploy/charts/distr --values "$values" >/dev/null
          done
      - name: Login to GitHub Container Registry (tag or manual only)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Distr Registry (tag or manual only)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.distr.sh
          username: ${{ github.actor }}
          password: ${{ secrets.DISTR_TOKEN }}
      - name: Push helm chart to ghcr.io (tag or manual only)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        run: |
          for chart in distr-*.tgz; do
              helm push "$chart" oci://ghcr.io/distr-sh/charts
              helm push "$chart" oci://registry.distr.sh/enterprise/charts
          done
