# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Check mise & renovate config

on:
  push:
    branches:
      - 'main'
    paths:
      - 'mise.toml'
      - '.github/workflows/mise-renovate.yaml'
      - renovate.json
  pull_request:
    paths:
      - 'mise.toml'
      - '.github/workflows/mise-renovate.yaml'
      - renovate.json

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Validate renovate.json
        run: mise run lint:renovate-config
