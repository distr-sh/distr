# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Check mise & renovate config

on:
  push:
    branches:
      - 'main'
    paths:
      - 'mise.toml'
      - '.github/workflows/mise-renovate.yaml'
      - renovate.json
  pull_request:
    paths:
      - 'mise.toml'
      - '.github/workflows/mise-renovate.yaml'
      - renovate.json

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
      - name: Validate renovate.json
        run: mise run lint:renovate-config
