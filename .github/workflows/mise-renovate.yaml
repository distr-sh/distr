# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Check mise & renovate config

on:
  push:
    branches:
      - 'main'
    paths:
      - 'mise.toml'
      - '.github/workflows/mise-renovate.yaml'
      - renovate.json
  pull_request:
    paths:
      - 'mise.toml'
      - '.github/workflows/mise-renovate.yaml'
      - renovate.json

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Validate renovate.json
        run: mise run lint:renovate-config
