# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/website.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - 'CHANGELOG.md'
      - '.github/workflows/website.yaml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            website
            CHANGELOG.md
          sparse-checkout-cone-mode: false
          # Starlight's lastUpdated reads each page's git history. At depth 1
          # every docs page is stamped with the deploy commit, which misinforms
          # readers and makes IndexNow see all of them change.
          fetch-depth: 0
      - name: Restore LFS cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: website-lfs-${{ github.sha }}
          restore-keys: website-lfs-
      - name: Pull LFS objects
        run: git lfs pull
      - name: Save LFS cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: website-lfs-${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'website/package.json'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('website/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm i
      - name: Lint with prettier
        run: pnpm run lint
      - name: Check with astro
        run: pnpm run check
      - name: Install playwright browser
        run: pnpm exec playwright install --only-shell
      - name: Build website
        run: pnpm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: github.ref == 'refs/heads/main'
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::639130800065:role/github-actions-distr.sh
      # The search engine steps continue on error: none of them may keep the
      # website from being deployed.
      - name: Download deployed pages
        id: deployed
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: >-
          aws s3 sync s3://distr.sh/ "$RUNNER_TEMP/deployed"
          --exclude "*" --include "*.html" --include "sitemap-*.xml"
          --only-show-errors
      - name: Detect changed pages
        id: changed
        if: github.ref == 'refs/heads/main' && steps.deployed.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/changed-pages.mjs "$RUNNER_TEMP/deployed" > "$RUNNER_TEMP/changed-pages.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/changed-pages.txt")" >> "$GITHUB_OUTPUT"
      - name: Write IndexNow key file
        id: indexnow-key
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: printf '%s' "${INDEXNOW_KEY:?}" > "dist/$INDEXNOW_KEY.txt"
      - name: Deploy hashed assets
        if: github.ref == 'refs/heads/main'
        run: >-
          aws s3 sync dist/_astro s3://distr.sh/_astro/
          --cache-control "max-age=31536000, public, immutable"
          --acl=public-read
      - name: Deploy dynamic content
        if: github.ref == 'refs/heads/main'
        run: >-
          aws s3 sync dist s3://distr.sh/
          --cache-control "max-age=60, public, must-revalidate"
          --acl=public-read
      - name: Invalidate cache
        if: github.ref == 'refs/heads/main'
        run: >-
          aws cloudfront create-invalidation
          --distribution-id E1PG5UM7ZE1H97
          --invalidation-batch "Paths={Quantity='1' ,Items=['/*']},CallerReference=WEBSITE_$GITHUB_RUN_ID"
      - name: Submit changed pages to IndexNow
        if: steps.changed.outputs.count > 0 && steps.indexnow-key.outcome == 'success'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          jq -nR --arg key "$INDEXNOW_KEY" \
            '{host: "distr.sh", key: $key, keyLocation: "https://distr.sh/\($key).txt", urlList: [inputs]}' \
            < "$RUNNER_TEMP/changed-pages.txt" |
            curl --fail-with-body --silent --show-error \
              -H 'content-type: application/json; charset=utf-8' \
              --data @- https://api.indexnow.org/indexnow
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: google
        if: steps.changed.outputs.count > 0
        continue-on-error: true
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false
      - name: Resubmit sitemap to Google Search Console
        if: steps.google.outcome == 'success'
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: >-
          curl --fail-with-body --silent --show-error -X PUT
          -H "Authorization: Bearer $ACCESS_TOKEN"
          "https://www.googleapis.com/webmasters/v3/sites/sc-domain%3Adistr.sh/sitemaps/https%3A%2F%2Fdistr.sh%2Fsitemap-index.xml"
