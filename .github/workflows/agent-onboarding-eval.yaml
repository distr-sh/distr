# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Agent Onboarding Eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: Cursor CLI model (agent --list-models)
        required: true
        default: claude-sonnet-5-thinking-high
      fixture:
        description: Application the coding agent onboards
        type: choice
        options:
          - compose-app
          - dockerfile-app
          - kubernetes-app
        default: compose-app
      prompt:
        description: onboard follows the runbook of this branch, cold starts from distr.sh as it is live
        type: choice
        options:
          - onboard
          - cold
        default: onboard

permissions:
  contents: read

jobs:
  eval:
    name: Eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # The connect command references the Docker controller image of the Distr version, and only a released version has one.
      - name: Build a Distr image with the version try.sh pins
        run: |
          version="$(sed -n 's/^DISTR_VERSION="\([^"]*\)".*/\1/p' deploy/docker/quickstart/try.sh)"
          printf '[env]\nVERSION = "%s"\n' "$version" > mise.eval.toml
          MISE_ENV=eval mise run build:distr:community
          cp dist/distr dist/distr-amd64
          touch dist/eval.spdx.json
          docker build -f Dockerfile.distr -t distr-ce:eval .

      - name: Install the Cursor CLI
        run: |
          curl -fsS https://cursor.com/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the eval
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: ${{ inputs.model }}
          FIXTURE: ${{ inputs.fixture }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -- --client cursor --model "$MODEL" --fixture "$FIXTURE" --prompt "$PROMPT" --timeout-minutes 45
          if [ "$PROMPT" = onboard ]; then
            set -- "$@" --local-assets --distr-image distr-ce:eval --expect-events
          fi
          mise exec -- node hack/agent-onboarding-eval/run.mjs "$@"

      - name: Write the job summary
        if: always()
        run: cat tmp/agent-onboarding-eval/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-onboarding-eval
          path: tmp/agent-onboarding-eval/
