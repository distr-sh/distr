# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Skills

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'skills/**'
      - '.github/workflows/skills.yaml'
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/skills.yaml'

permissions:
  contents: read

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: skills/package.json
      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: skills/package.json
          cache: pnpm
          cache-dependency-path: skills/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: skills
      - name: Build skill
        run: pnpm build snapshot
        working-directory: skills
      - name: Lint skill
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: skills/package.json
      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: skills/package.json
          cache: pnpm
          cache-dependency-path: skills/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: skills
      - name: Build skill
        run: pnpm build "$GITHUB_REF_NAME"
        working-directory: skills
      - name: Upload archives
        run: gh release upload "$GITHUB_REF_NAME" dist/skill/assets/*
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::639130800065:role/github-actions-distr.sh
      # The website deploy syncs without --delete and never writes this prefix, so neither
      # deploy removes or overwrites what the other one published.
      - name: Publish discovery index and Claude marketplace
        run: >-
          aws s3 sync dist/skill/site/.well-known/agent-skills/ s3://distr.sh/.well-known/agent-skills/
          --delete
          --cache-control "max-age=60, public, must-revalidate"
          --acl=public-read
      - name: Invalidate cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id E1PG5UM7ZE1H97
          --paths '/.well-known/agent-skills/*'
