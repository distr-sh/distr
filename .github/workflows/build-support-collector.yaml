# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build Support Collector

on:
  push:
    branches:
      - 'main'
    paths:
      - 'cmd/support-collector/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-support-collector.yaml'
    tags:
      - '*'
  pull_request:
    paths:
      - 'cmd/support-collector/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-support-collector.yaml'

jobs:
  build:
    name: Build support collector
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache-dependency-path: |
            go.sum
      - name: Generate commit hash
        id: hash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Build Archives
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -ldflags="$LDFLAGS" \
                -o "dist/$os-$arch/support-collector" ./cmd/support-collector/
              tar -czf "dist/support-collector-$os-$arch.tar.gz" \
                -C "dist/$os-$arch" support-collector
            done
          done
          cd dist
          sha256sum support-collector-*.tar.gz > support-collector-checksums.txt
        env:
          CGO_ENABLED: '0'
          LDFLAGS: >-
            -s -w
            -X github.com/distr-sh/distr/internal/buildconfig.version=${{ github.ref_name }}
            -X github.com/distr-sh/distr/internal/buildconfig.commit=${{ steps.hash.outputs.sha_short }}
      - name: Upload Archives (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-collector
          path: |
            dist/support-collector-*.tar.gz
            dist/support-collector-checksums.txt
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release support collector
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download Archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: support-collector
          path: dist
      - name: Attest Archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/support-collector-checksums.txt
      - name: Upload Archives to the Release
        run: |
          gh release upload -- "$GITHUB_REF_NAME" \
            dist/support-collector-*.tar.gz \
            dist/support-collector-checksums.txt
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
