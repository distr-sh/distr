# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Check agent skill

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'hack/build-skill.sh'
      - 'hack/lint-skill.sh'
      - '.release-please-manifest.json'
      - '.github/workflows/skill.yaml'
  pull_request:
    paths:
      - 'skills/**'
      - 'hack/build-skill.sh'
      - 'hack/lint-skill.sh'
      - '.release-please-manifest.json'
      - '.github/workflows/skill.yaml'

permissions:
  contents: read

concurrency:
  group: skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: 'node pnpm yq 7zip'
      - name: Lint agent skill
        run: mise run lint:skill
        env:
          GH_TOKEN: ${{ github.token }}
